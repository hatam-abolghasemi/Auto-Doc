[defaults]
inventory = ./hosts.yaml
host_key_checking = False
timeout = 120
retries = 0
# Hosts gathered in parallel. Default is 5, far too few for a large fleet.
forks = 100

[ssh_connection]
retries = 0
pipelining = True
timeout = 120
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o ServerAliveCountMax=6
