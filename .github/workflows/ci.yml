name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Ansible and export dependencies
        run: pip install ansible-core -r scripts/requirements.txt

      - name: Playbook syntax check
        run: ansible-playbook main.yaml --syntax-check

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py

      - name: Build the workbook from the sample data (upload is skipped)
        run: |
          mkdir -p outputs
          cp examples/outputs/*.json outputs/
          ansible-playbook main.yaml --tags sheets

      - name: Keep the sample workbook
        uses: actions/upload-artifact@v4
        with:
          name: auto-doc-example
          path: |
            outputs/auto-doc.xlsx
            outputs/auto-doc.links.json
          retention-days: 14
