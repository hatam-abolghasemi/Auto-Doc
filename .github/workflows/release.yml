name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install export dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build the sample workbook
        run: |
          python scripts/json-to-xlsx.py --input examples/outputs --output dist/auto-doc-example.xlsx
          rm dist/auto-doc-example.links.json

      - name: Extract release title and notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Heading format: ## [1.0.0] - 2026-11-11 — Short description
          description=$(grep -m1 "^## \[$version\]" CHANGELOG.md | sed -n 's/^[^—]*— *//p')
          echo "RELEASE_TITLE=$GITHUB_REF_NAME${description:+ — $description}" >> "$GITHUB_ENV"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/auto-doc-example.xlsx \
            --title "$RELEASE_TITLE" \
            --notes-file dist/notes.md \
            --verify-tag
