# Copy to secrets/sheets.yaml (gitignored) and fill in.
# Setup guide: docs/google-sheets.md

# The long ID in the Sheet URL:
# https://docs.google.com/spreadsheets/d/<THIS_PART>/edit
autodoc_sheet_id: ""

# Service account JSON key. Relative paths are resolved from the repo root.
autodoc_google_credentials: "secrets/google-service-account.json"

# Optional: HTTP proxy for reaching *.googleapis.com, e.g. "http://10.0.0.1:3128".
# Empty = direct connection (or HTTPS_PROXY from the environment).
autodoc_https_proxy: ""
