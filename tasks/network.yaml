---
- name: "Get expanded network details for specific subnets"
  raw: |
    default_gw=$(ip route show default | awk '/default/ {print $3}' | head -n1)
    ip -o -4 addr show | grep -E '172\.16\.' | while read -r line; do
      dev=$(echo "$line" | awk '{print $2}')
      ip_with_mask=$(echo "$line" | awk '{print $4}')
      ip_addr=$(echo "$ip_with_mask" | cut -d/ -f1)
      net_prefix=$(echo "$ip_addr" | cut -d. -f1-3)
      network_subnet="${net_prefix}.0/24"
      mac=$(cat "/sys/class/net/$dev/address" 2>/dev/null || echo "unknown")
      mtu=$(cat "/sys/class/net/$dev/mtu" 2>/dev/null || echo "0")
      state=$(cat "/sys/class/net/$dev/operstate" 2>/dev/null || echo "unknown")
      is_gw="false"
      ip route show dev "$dev" | grep -q "default via $default_gw" && is_gw="true"
      [ -z "$default_gw" ] && default_gw="none"
      printf "%s|%s|%s|%s|%s|%s|%s|%s\n" "$dev" "$network_subnet" "$ip_addr" "$mac" "$mtu" "$state" "$default_gw" "$is_gw"
    done
  register: network_raw
  changed_when: false

- name: "Initialize empty network list"
  set_fact:
    host_network_list: []

- name: "Process network lines into facts"
  vars:
    n: "{{ item.split('|') }}"
  set_fact:
    host_network_list: >-
      {{ host_network_list + [{
        "target_ip": n[2],
        "target_name": target_name,
        "network_ip": n[2],
        "network_subnet": n[1],
        "network_device": n[0],
        "network_mac": n[3],
        "network_mtu": n[4],
        "network_state": n[5],
        "network_gateway": n[6],
        "network_is_default": n[7]
      }] }}
  loop: "{{ network_raw.stdout_lines }}"
  when: 
    - item | trim != ""
    - item.split('|') | length == 8

- name: "Generate network JSON (Local)"
  delegate_to: localhost
  become: no
  run_once: yes
  copy:
    dest: "outputs/network.json"
    content: >-
      {{ ansible_play_hosts_all 
         | map('extract', hostvars, 'host_network_list') 
         | flatten 
         | select('defined')
         | list
         | to_nice_json(indent=4) }}
    force: yes