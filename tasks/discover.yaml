---

- name: Check that jq is available on the control node
  ansible.builtin.command: jq --version
  register: jq_check
  changed_when: false
  failed_when: false

- name: Fail if jq is missing on the control node
  ansible.builtin.fail:
    msg: "jq is required on the control node to build hosts.yaml (sudo apt-get install -y jq)"
  when: jq_check.rc != 0

- name: Ensure outputs directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/outputs"
    state: directory
    mode: '0755'

- name: "Discover hosts and their hostnames across the given subnets"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      PORT="{{ discovery_ssh_port | default(22) }}"

      # Total time budget PER HOST, in seconds -- shared across every user+key
      # combination tried against that host. A host is never worked longer than
      # this no matter how many keys exist, because each ssh call is wrapped in
      # `timeout` with only the remaining budget. This is the hard "maximum 120s
      # per host" cap.
      SSH_TRY_TIMEOUT="{{ discovery_ssh_timeout | default(120) }}"

      # Connect timeout for a single ssh attempt.
      CONNECT_TIMEOUT="{{ discovery_ssh_connect_timeout | default(20) }}"

      # Hosts that have port 22 open but did not answer for a reason other than
      # an auth refusal (timeout, reset, closed during banner exchange, refused,
      # no stderr at all...) get re-probed: RETRY_ROUNDS more rounds, each after
      # RETRY_DELAY seconds, with the longer RETRY_CONNECT_TIMEOUT and a fresh
      # SSH_TRY_TIMEOUT budget. Auth refusals are never retried -- another try
      # gets the same answer.
      RETRY_ROUNDS="{{ discovery_ssh_retries | default(2) }}"
      RETRY_CONNECT_TIMEOUT="{{ discovery_ssh_retry_connect_timeout | default(45) }}"
      RETRY_DELAY="{{ discovery_ssh_retry_delay | default(10) }}"

      # ssh errors that mean "this credential/host will refuse us every time".
      AUTH_REFUSAL='permission denied|too many authentication failures|host key verification failed|unable to negotiate|no matching|no supported authentication'

      # discovery_ssh_bypass_proxy: true adds -o ProxyCommand=none to every
      # discovery probe and to the collectors' connections. See ssh_opts_for_key.
      BYPASS_PROXY="{{ discovery_ssh_bypass_proxy | default(false) | bool | lower }}"

      # Users to try per host, in order, until one authenticates.
      IFS=',' read -ra SSH_USERS <<< "{{ discovery_ssh_users | default([discovery_ssh_user | default('root')]) | join(',') }}"

      # Keys the caller explicitly configured (if any) get tried first, before
      # anything auto-discovered. Empty by default -- most fleets shouldn't
      # need to set this at all.
      CONFIGURED_KEYS_CSV="{{ (discovery_ssh_keys | default([]) + ([discovery_ssh_key] if discovery_ssh_key is defined else [])) | join(',') }}"

      # Every private key sitting in this directory is tried, in addition to the
      # configured ones and whatever `ssh -G` resolves. This is what picks up
      # non-standard key names (e.g. ~/.ssh/jenkins) that ssh wouldn't try
      # on its own. A file counts as a private key if it is not a .pub/cert,
      # not known_hosts/config/authorized_keys, and its first line says
      # "PRIVATE KEY". Built once here and reused for every host.
      KEY_DIR="{{ discovery_ssh_key_dir | default(lookup('env', 'HOME') ~ '/.ssh') }}"
      AUTO_KEYS=()
      if [ -d "$KEY_DIR" ]; then
        for _kf in "$KEY_DIR"/*; do
          [ -f "$_kf" ] || continue
          case "$_kf" in
            *.pub|*-cert.pub) continue ;;
            */known_hosts|*/known_hosts.old|*/config|*/authorized_keys) continue ;;
          esac
          head -n1 "$_kf" 2>/dev/null | grep -q 'PRIVATE KEY' || continue
          AUTO_KEYS+=("$_kf")
        done
      fi

      ssh_opts_for_key() {
        local key="$1"
        local connect_timeout="${2:-$CONNECT_TIMEOUT}"
        SSH_OPTS_CUR=(
          -o BatchMode=yes
          -o ConnectTimeout="$connect_timeout"
          -o ConnectionAttempts=1
          -o ServerAliveInterval=15
          -o ServerAliveCountMax=4
          -o PreferredAuthentications=publickey
          -o GSSAPIAuthentication=no
          -o StrictHostKeyChecking=accept-new
          -o UserKnownHostsFile=/dev/null
          -o LogLevel=ERROR
          -p "$PORT"
        )
        # Opt-in: bypass any global ProxyCommand (e.g. SSSD's
        # sss_ssh_knownhostsproxy set for '*' in /etc/ssh/ssh_config), which can
        # stall past ConnectTimeout and make discovery miss most hosts. Off by
        # default, since it would also skip jump hosts configured that way.
        if [ "$BYPASS_PROXY" = "true" ]; then
          SSH_OPTS_CUR+=(-o ProxyCommand=none)
        fi
        if [ "$key" != "__default__" ]; then
          # IdentitiesOnly=yes makes this attempt offer ONLY this one key, not
          # every agent/default key as well. Without it, probing many keys can
          # blow past the server's MaxAuthTries (default 6) -> "Too many
          # authentication failures", which can even mask a key that works.
          SSH_OPTS_CUR+=(-i "$key" -o IdentitiesOnly=yes)
        fi
      }

      # Builds the ordered list of keys to try against a specific target:
      # 1) any keys explicitly configured above
      # 2) every IdentityFile ssh would already use for this target according
      #    to this control node's own ssh config (`ssh -G` is a pure local
      #    config lookup -- no network call, can't hang, doesn't touch
      #    anything), filtered down to files that actually exist on disk
      # 3) "__default__" as a final catch-all, meaning "don't pass -i at all"
      #    and let ssh fall back to ssh-agent / normal resolution itself --
      #    this is what covers agent-forwarded or hardware-token keys that
      #    aren't backed by a file at all
      # Duplicate keys are only tried once, first occurrence wins.
      get_keys_for_target() {
        local target="$1"
        local -a keys=()
        local -a configured=()
        if [ -n "$CONFIGURED_KEYS_CSV" ]; then
          IFS=',' read -ra configured <<< "$CONFIGURED_KEYS_CSV"
        fi
        local k f dup existing
        for k in "${configured[@]}"; do
          k="$(echo "$k" | xargs)"
          [ -n "$k" ] && keys+=("$k")
        done
        # Then every private key auto-discovered in KEY_DIR (deduped).
        for k in "${AUTO_KEYS[@]}"; do
          dup=0
          for existing in "${keys[@]}"; do
            [ "$existing" = "$k" ] && dup=1 && break
          done
          [ "$dup" -eq 0 ] && keys+=("$k")
        done
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          dup=0
          for existing in "${keys[@]}"; do
            [ "$existing" = "$f" ] && dup=1 && break
          done
          [ "$dup" -eq 0 ] && keys+=("$f")
        done < <(timeout "$SSH_TRY_TIMEOUT" ssh -G "$target" 2>/dev/null \
                    | awk 'tolower($1)=="identityfile"{print $2}' \
                    | sed "s|^~|$HOME|" \
                    | while IFS= read -r ff; do [ -f "$ff" ] && echo "$ff"; done)
        keys+=("__default__")
        printf '%s\n' "${keys[@]}"
      }

      # Domain suffixes to strip when deriving a host's group name. Sorted
      # longest-first: a more specific suffix like "dc1.company.local"
      # must be tried before the shorter "company.local" it ends with --
      # otherwise the shorter one matches first, strips only part of the
      # domain, and the longer one never gets a chance to match what's left
      # (e.g. "infra-awx-186.dc1.company.local" would stop at
      # "infra-awx-186.dc1" instead of reducing all the way to
      # "infra-awx-186").
      mapfile -t DOMAIN_SUFFIXES < <(
        IFS=',' read -ra _raw_suffixes <<< "{{ discovery_domain_suffix | default(['dc1.local', 'company.dev', 'company.local', 'company.internal', 'dc1.company.local']) | join(',') }}"
        for _s in "${_raw_suffixes[@]}"; do
          _s="$(echo "$_s" | xargs)"
          [ -n "$_s" ] && printf '%s\n' "$_s"
        done | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2-
      )

      CONCURRENCY=200
      ALL_RESULTS=()
      PROGRESS_LOG="{{ playbook_dir }}/outputs/.discovery_progress.log"
      : > "$PROGRESS_LOG"
      log_progress() {
        echo "[$(date '+%H:%M:%S')] $*" >> "$PROGRESS_LOG"
      }
      # Every open-22 host that does NOT authenticate is recorded here with its
      # ssh error, so the hosts dropped from the fleet can be triaged (wrong
      # credentials vs a real timeout vs not-a-login-server) instead of vanishing.
      FAIL_LOG="{{ playbook_dir }}/outputs/.discovery_failures.log"
      : > "$FAIL_LOG"
      # Hosts that failed the first probe for a non-auth reason and then
      # answered on a retry: ip|round|first error. A host that shows up here on
      # some nights is flaky at that hour, not misconfigured.
      RETRY_LOG="{{ playbook_dir }}/outputs/.discovery_retries.log"
      : > "$RETRY_LOG"
      # Counts array elements via a positional-parameter trick instead of
      # bash's usual array-length syntax, because that syntax's dollar-brace-
      # hash opening sequence is misread by Ansible's Jinja templating as a
      # comment-open tag and can silently corrupt or break this script.
      arrlen() { echo "$#"; }

      IFS=',' read -ra SUBNETS <<< "{{ subnets }}"
      IFS=',' read -ra EXCLUDE_IPS <<< "{{ exclude_ips | default([]) | join(',') }}"

      is_excluded() {
        local ip="$1"
        for ex in "${EXCLUDE_IPS[@]}"; do
          [ -z "$ex" ] && continue
          [ "$ip" = "$ex" ] && return 0
        done
        return 1
      }

      # --- Phase 1: port-scan every subnet at once, not one at a time. ------
      # This used to be a sequential `for subnet in ...` loop where each
      # nmap call could take up to 60s -- with N subnets that's up to N*60s
      # before the last one even starts. Now every subnet is scanned in its
      # own background job concurrently, so total phase-1 time is bounded by
      # the single slowest subnet, not the sum of all of them.
      log_progress "phase 1: scanning $(arrlen "${SUBNETS[@]}") subnet(s) for open port ${PORT} (in parallel)"

      SCAN_TMPDIR=$(mktemp -d)
      trap 'rm -rf "$SCAN_TMPDIR"' EXIT

      subnet_idx=0
      SCAN_PIDS=()
      for subnet in "${SUBNETS[@]}"; do
        subnet="$(echo "$subnet" | xargs)"
        [ -z "$subnet" ] && continue
        [[ "$subnet" != */* ]] && subnet="${subnet}/24"
        subnet_idx=$((subnet_idx + 1))
        outfile="$SCAN_TMPDIR/subnet_${subnet_idx}.txt"

        (
          if command -v nmap >/dev/null 2>&1; then
            timeout 60 nmap -n -Pn -T4 --host-timeout 5s --max-retries 1 -p "$PORT" --open "$subnet" -oG - 2>/dev/null \
              | awk '/Ports/{print $2}' > "$outfile"
          else
            BASE="${subnet%.*/*}"
            : > "$outfile"
            for i in $(seq 1 254); do
              ip="${BASE}.${i}"
              (timeout 0.5 bash -c "exec 3<>/dev/tcp/${ip}/${PORT}" 2>/dev/null && echo "$ip" >> "$outfile") &
              while (( $(jobs -r | wc -l) >= CONCURRENCY )); do wait -n; done
            done
            wait
          fi
          log_progress "phase 1: ${subnet} done -- $(wc -l < "$outfile") host(s) with port ${PORT} open"
        ) &
        SCAN_PIDS+=("$!")
      done
      wait "${SCAN_PIDS[@]}"

      ALL_OPEN_IPS=()
      for outfile in "$SCAN_TMPDIR"/subnet_*.txt; do
        [ -f "$outfile" ] || continue
        while IFS= read -r ip; do
          [ -z "$ip" ] && continue
          is_excluded "$ip" && continue
          ALL_OPEN_IPS+=("$ip")
        done < "$outfile"
      done
      log_progress "phase 1 complete: $(arrlen "${ALL_OPEN_IPS[@]}") total host(s) to probe over ssh"

      # --- Phase 2: ssh-probe every discovered host in one shared pool. -----
      # All subnets feed into a single CONCURRENCY-limited pool here instead
      # of each subnet getting its own separate batch, so probing for subnet
      # #2 isn't blocked waiting on subnet #1 to fully finish.
      # Probes one host with every user+key until one authenticates. Prints one
      # line:
      #   OK|ip|hostname|group|user|key
      #   FAIL|ip|rc=N|error           only auth refusals -- not worth retrying
      #   RETRY|ip|rc=N|error          at least one attempt failed for another
      #                                reason (it may have been the right key)
      # The non-auth error is kept even when later keys were refused, since it
      # may have hit the key that works; logging only the last error used to
      # make those hosts look like plain "Permission denied".
      probe_host() {
        local ip="$1" connect_timeout="$2"
        local hostname="" last_err="" last_rc=0 soft_err="" soft_rc=0 err_line remaining user key
        local errf
        errf=$(mktemp)
        local -a KEYS_FOR_IP
        mapfile -t KEYS_FOR_IP < <(get_keys_for_target "$ip")
        # One shared SSH_TRY_TIMEOUT budget for this host: every user+key
        # attempt draws from the same deadline, so trying many keys can never
        # push a single host past the cap.
        local deadline=$(( SECONDS + SSH_TRY_TIMEOUT ))
        for user in "${SSH_USERS[@]}"; do
          for key in "${KEYS_FOR_IP[@]}"; do
            remaining=$(( deadline - SECONDS ))
            if [ "$remaining" -le 0 ]; then
              last_rc=124
              last_err="hard timeout after ${SSH_TRY_TIMEOUT}s (budget exhausted)"
              [ -z "$soft_err" ] && soft_err="$last_err" && soft_rc=124
              break 2
            fi
            ssh_opts_for_key "$key" "$connect_timeout"
            hostname=$(timeout "$remaining" ssh "${SSH_OPTS_CUR[@]}" "${user}@${ip}" "hostname" 2>"$errf")
            last_rc=$?
            if [ -n "$hostname" ]; then
              rm -f "$errf"
              printf 'OK|%s|%s|%s|%s|%s\n' "$ip" "$hostname" "$(derive_group "$hostname")" "$user" "$key"
              return
            fi
            # Keep the most telling line of this attempt's stderr for triage.
            err_line=$(grep -iE 'denied|timed out|refused|closed|unreachable|no route|host key|not known|reset|too many|banner|kex_exchange' "$errf" | tail -n1)
            [ -z "$err_line" ] && err_line=$(tail -n1 "$errf")
            [ "$last_rc" = "124" ] && err_line="hard timeout after ${SSH_TRY_TIMEOUT}s"
            [ -z "$err_line" ] && err_line="no error output"
            last_err="$err_line"
            if ! grep -qiE "$AUTH_REFUSAL" <<< "$err_line"; then
              [ -z "$soft_err" ] && soft_err="$err_line" && soft_rc="$last_rc"
            fi
          done
        done
        rm -f "$errf"
        if [ -n "$soft_err" ]; then
          if [ "$soft_err" = "$last_err" ]; then
            printf 'RETRY|%s|rc=%s|%s\n' "$ip" "$soft_rc" "$soft_err"
          else
            printf 'RETRY|%s|rc=%s|%s (last attempt: %s)\n' "$ip" "$soft_rc" "$soft_err" "$last_err"
          fi
        else
          printf 'FAIL|%s|rc=%s|%s\n' "$ip" "$last_rc" "$last_err"
        fi
      }

      derive_group() {
        local group="$1" stripped=1 suf
        while [ "$stripped" -eq 1 ]; do
          stripped=0
          for suf in "${DOMAIN_SUFFIXES[@]}"; do
            if [[ "$group" == *".${suf}" ]]; then
              group="${group%.${suf}}"
              stripped=1
              break
            fi
          done
        done
        # strip any trailing run of non-letter characters (digits, dashes,
        # dots, etc.) one char at a time until the group ends in a letter
        # (e.g. "worker8" -> "worker", "node-104037" -> "node",
        # "app.stg-" -> "app.stg" -> "app")
        while [[ "$group" =~ [^A-Za-z]$ ]]; do
          group="${group%?}"
        done
        echo "$group"
      }

      # Runs probe_host over the given ips in one CONCURRENCY-limited pool.
      # $1 = connect timeout, $2 = progress label, rest = ips.
      probe_pool() {
        local connect_timeout="$1" label="$2"; shift 2
        local total=$# probed=0 ip
        for ip in "$@"; do
          ( probe_host "$ip" "$connect_timeout" ) &
          while (( $(jobs -r | wc -l) >= CONCURRENCY )); do
            wait -n
            probed=$((probed + 1))
            (( probed % 25 == 0 )) && log_progress "${label}: probed ~${probed}/${total} host(s)"
          done
        done
        wait
      }

      total_to_probe=$(arrlen "${ALL_OPEN_IPS[@]}")
      declare -A FIRST_ERR
      declare -A LAST_LINE
      RETRY_IPS=()
      while IFS= read -r line; do
        case "$line" in
          OK\|*)    ALL_RESULTS+=("${line#OK|}") ;;
          FAIL\|*)  echo "${line#FAIL|}" >> "$FAIL_LOG" ;;
          RETRY\|*) rest="${line#RETRY|}"; ip="${rest%%|*}"
                    RETRY_IPS+=("$ip"); FIRST_ERR[$ip]="${rest#*|}"; LAST_LINE[$ip]="$rest" ;;
        esac
      done < <(probe_pool "$CONNECT_TIMEOUT" "phase 2" "${ALL_OPEN_IPS[@]}")
      log_progress "phase 2: first pass done -- $(arrlen "${ALL_RESULTS[@]}") authenticated, $(arrlen "${RETRY_IPS[@]}") to retry (non-auth errors)"

      # --- Phase 2b: retry hosts that failed for a non-auth reason. ----------
      round=0
      while [ "$round" -lt "$RETRY_ROUNDS" ] && [ "$(arrlen "${RETRY_IPS[@]}")" -gt 0 ]; do
        round=$((round + 1))
        sleep "$RETRY_DELAY"
        log_progress "phase 2b: retry ${round}/${RETRY_ROUNDS} for $(arrlen "${RETRY_IPS[@]}") host(s), ConnectTimeout=${RETRY_CONNECT_TIMEOUT}s"
        NEXT_RETRY=()
        while IFS= read -r line; do
          case "$line" in
            OK\|*)    rest="${line#OK|}"; ip="${rest%%|*}"
                      ALL_RESULTS+=("$rest")
                      printf '%s|retry %s|%s\n' "$ip" "$round" "${FIRST_ERR[$ip]}" >> "$RETRY_LOG" ;;
            FAIL\|*)  echo "${line#FAIL|}" >> "$FAIL_LOG" ;;
            RETRY\|*) rest="${line#RETRY|}"; ip="${rest%%|*}"
                      NEXT_RETRY+=("$ip"); LAST_LINE[$ip]="$rest" ;;
          esac
        done < <(probe_pool "$RETRY_CONNECT_TIMEOUT" "phase 2b retry ${round}" "${RETRY_IPS[@]}")
        log_progress "phase 2b: retry ${round} recovered $(( $(arrlen "${RETRY_IPS[@]}") - $(arrlen "${NEXT_RETRY[@]}") )) host(s)"
        RETRY_IPS=("${NEXT_RETRY[@]}")
      done
      for ip in "${RETRY_IPS[@]}"; do
        echo "${LAST_LINE[$ip]} [after ${round} retr$( [ "$round" -eq 1 ] && echo y || echo ies )]" >> "$FAIL_LOG"
      done

      # Every probed host ends up in exactly one place: an authenticated result
      # line or a line in FAIL_LOG. So authed + failed is the exact number of
      # hosts probed -- no racy job counting needed -- and it equals the count
      # found in phase 1.
      authed=$(arrlen "${ALL_RESULTS[@]}")
      failed=$(wc -l < "$FAIL_LOG" | tr -d ' ')
      recovered=$(wc -l < "$RETRY_LOG" | tr -d ' ')
      log_progress "phase 2 complete: probed $(( authed + failed ))/${total_to_probe} host(s) -- ${authed} authenticated (${recovered} only on retry, see outputs/.discovery_retries.log), ${failed} did not (see outputs/.discovery_failures.log)"

      resolve_primary_ip() {
        local hostname="$1"; shift
        local ssh_user="$1"; shift
        local ssh_key="$1"; shift
        local candidates=("$@")

        ssh_opts_for_key "$ssh_key"

        local candidate_count
        candidate_count=$(printf '%s\n' "${candidates[@]}" | grep -c .)
        if [ "$candidate_count" -eq 1 ]; then
          echo "${candidates[0]}|single"
          return
        fi

        local probe_ip="${candidates[0]}"

        local netplan_ips
        netplan_ips=$(timeout "$SSH_TRY_TIMEOUT" ssh "${SSH_OPTS_CUR[@]}" "${ssh_user}@${probe_ip}" \
          "grep -hoE '^[[:space:]]*-[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+' /etc/netplan/*.yaml 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'" 2>/dev/null)

        local match="" count=0
        for ip in "${candidates[@]}"; do
          if echo "$netplan_ips" | grep -qx "$ip"; then
            match="$ip"; count=$((count+1))
          fi
        done
        if [ "$count" -eq 1 ]; then
          echo "${match}|netplan"
          return
        fi

        local route_ip
        route_ip=$(timeout "$SSH_TRY_TIMEOUT" ssh "${SSH_OPTS_CUR[@]}" "${ssh_user}@${probe_ip}" \
          "ip -4 route get 1.1.1.1 2>/dev/null | sed -n 's/.* src \([0-9.]*\).*/\1/p'" 2>/dev/null)
        for ip in "${candidates[@]}"; do
          if [ "$ip" = "$route_ip" ]; then
            echo "${ip}|route"
            return
          fi
        done

        local lowest
        lowest=$(printf '%s\n' "${candidates[@]}" | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | head -n1)
        echo "${lowest}|guess"
      }

      declare -A HOST_IPS
      declare -A HOST_GROUP
      declare -A HOST_AUTH_USER
      declare -A HOST_AUTH_KEY
      declare -a HOST_ORDER

      while IFS='|' read -r ip hostname group auth_user auth_key; do
        [ -z "$hostname" ] && continue
        if [ -z "${HOST_GROUP[$hostname]+x}" ]; then
          HOST_ORDER+=("$hostname")
          HOST_GROUP[$hostname]="$group"
          HOST_AUTH_USER[$hostname]="$auth_user"
          HOST_AUTH_KEY[$hostname]="$auth_key"
        fi
        HOST_IPS[$hostname]="${HOST_IPS[$hostname]:-} $ip"
      done < <(printf '%s\n' "${ALL_RESULTS[@]}" | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n)

      FINAL_RESULTS=()
      for hostname in "${HOST_ORDER[@]}"; do
        read -ra candidates <<< "${HOST_IPS[$hostname]}"
        resolved=$(resolve_primary_ip "$hostname" "${HOST_AUTH_USER[$hostname]}" "${HOST_AUTH_KEY[$hostname]}" "${candidates[@]}")
        chosen_ip="${resolved%%|*}"
        method="${resolved##*|}"

        extra=()
        for c in "${candidates[@]}"; do
          [ "$c" != "$chosen_ip" ] && extra+=("$c")
        done
        extra_csv=$(IFS=,; echo "${extra[*]}")
        [ -z "$extra_csv" ] && extra_csv="-"

        FINAL_RESULTS+=("${chosen_ip}|${hostname}|${HOST_GROUP[$hostname]}|${extra_csv}|${method}|${HOST_AUTH_USER[$hostname]}|${HOST_AUTH_KEY[$hostname]}")
      done

      printf '%s\n' "${FINAL_RESULTS[@]}" | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n
  register: discovery_raw
  changed_when: false

- name: Fail loudly if nothing was discovered
  ansible.builtin.fail:
    msg: "No hosts responded on any of: {{ subnets }}. Nothing to document this run."
  when: discovery_raw.stdout | trim == ""

- name: Warn about hosts whose static ip could not be confirmed
  ansible.builtin.debug:
    msg: >-
      Unverified: {{ item.split('|')[1] }} -- picked {{ item.split('|')[0] }}
      as a best guess (no netplan match, default route also unavailable).
      Other ips seen: {{ item.split('|')[3] }}. Verify manually if this matters.
  loop: "{{ discovery_raw.stdout_lines }}"
  when:
    - item | trim != ""
    - (item.split('|') | length) == 7
    - item.split('|')[4] == "guess"
  loop_control:
    label: "{{ item.split('|')[1] }}"

- name: Warn about hosts reached only via a non-default ssh credential
  ansible.builtin.debug:
    msg: >-
      {{ item.split('|')[1] }} did not authenticate with the default
      discovery credential; it responded as user "{{ item.split('|')[5] }}"
      using key "{{ item.split('|')[6] }}". Subsequent tasks against this
      host will use that same credential automatically.
  loop: "{{ discovery_raw.stdout_lines }}"
  when:
    - item | trim != ""
    - (item.split('|') | length) == 7
    - not (item.split('|')[5] == (discovery_ssh_user | default('root')) and item.split('|')[6] == (discovery_ssh_key | default('~/.ssh/id_rsa')))
  loop_control:
    label: "{{ item.split('|')[1] }}"

- name: Write raw discovery output to a temp file
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/outputs/.discovery_raw.txt"
    content: "{{ discovery_raw.stdout }}\n"
    mode: '0644'

- name: "Build the subnet -> datacenter lookup table from subnets.yaml"
  set_fact:
    subnet_ranges: >-
      {%- set out = [] -%}
      {%- for s in autodoc_subnets | default([]) -%}
        {%- set net, pfx = s.cidr.split('/') -%}
        {%- set o = net.split('.') | map('int') | list -%}
        {%- set start = o[0] * 16777216 + o[1] * 65536 + o[2] * 256 + o[3] -%}
        {%- set _ = out.append({'start': start, 'end': start + 2 ** (32 - pfx | int) - 1, 'prefix': pfx | int,
                                'dc': s.dc, 'subnet_group': s.subnet_group}) -%}
      {%- endfor -%}
      {{ out | to_json | from_json }}

- name: "Write hosts.yaml as a plain output record (not read back as inventory)"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      jq -R -s --argjson ranges '{{ subnet_ranges | to_json }}' '
        # most specific subnets.yaml entry holding this ip, else unknown
        def placement($ip):
          ($ip | split(".") | map(tonumber) | .[0] * 16777216 + .[1] * 65536 + .[2] * 256 + .[3]) as $n
          | ([$ranges[] | select(.start <= $n and $n <= .end)] | sort_by(-.prefix) | .[0])
            // {dc: "unknown", subnet_group: "unknown"};
        split("\n") | map(select(length > 0)) | map(split("|"))
        | map({
            ip: .[0], hostname: .[1], group: .[2],
            extra_ips: (if .[3] == "-" then [] else (.[3] | split(",")) end),
            ip_source: .[4],
            auth_user: .[5],
            auth_key: .[6]
          })
        | group_by(.group)
        | map({
            key: (.[0].group | gsub("-";"_")),
            value: {
              hosts: (map({
                key: .hostname,
                value: ({
                  ansible_host: .ip,
                  target_name: .hostname,
                  target_group: .group,
                  target_dc: placement(.ip).dc,
                  target_subnet_group: placement(.ip).subnet_group,
                  extra_ips: .extra_ips,
                  ip_source: .ip_source,
                  ansible_user: .auth_user
                } + (if .auth_key == "__default__" then {} else {ansible_ssh_private_key_file: .auth_key} end))
              }) | from_entries)
            }
          })
        | from_entries
        | {all: {children: ., vars: {
              ansible_user: "{{ discovery_ssh_user | default('root') }}",
              ansible_ssh_private_key_file: "{{ discovery_ssh_key | default('~/.ssh/id_rsa') }}",
              ansible_port: {{ discovery_ssh_port | default(22) }}
            }}}
      ' "{{ playbook_dir }}/outputs/.discovery_raw.txt" > "{{ playbook_dir }}/hosts.yaml"
  changed_when: true

- name: Initialize discovered hosts list
  set_fact:
    discovered_hosts_list: []

- name: Parse discovery output into facts
  set_fact:
    discovered_hosts_list: >-
      {{ discovered_hosts_list + [{
        'ip': item.split('|')[0],
        'hostname': item.split('|')[1],
        'group': item.split('|')[2],
        'extra_ips': (item.split('|')[3] if item.split('|')[3] != '-' else ''),
        'ip_source': item.split('|')[4],
        'auth_user': item.split('|')[5],
        'auth_key': item.split('|')[6]
      }] }}
  loop: "{{ discovery_raw.stdout_lines }}"
  when:
    - item | trim != ""
    - (item.split('|') | length) == 7

- name: "Inject discovered hosts into THIS run's live inventory"
  ansible.builtin.add_host:
    name: "{{ item.hostname }}"
    groups:
      - discovered_fleet
      - "{{ item.group | replace('-', '_') }}"
    ansible_host: "{{ item.ip }}"
    target_name: "{{ item.hostname }}"
    target_group: "{{ item.group }}"
    target_dc: "{{ placement.dc }}"
    target_subnet_group: "{{ placement.subnet_group }}"
    extra_ips: "{{ item.extra_ips }}"
    ip_source: "{{ item.ip_source }}"
    ansible_user: "{{ item.auth_user }}"
    ansible_ssh_private_key_file: "{{ omit if item.auth_key == '__default__' else item.auth_key }}"
    ansible_port: "{{ discovery_ssh_port | default(22) }}"
  loop: "{{ discovered_hosts_list }}"
  loop_control:
    label: "{{ item.hostname }} ({{ item.ip }})"
  vars:
    # most specific subnets.yaml entry holding this ip, else unknown
    ip_octets: "{{ item.ip.split('.') | map('int') | list }}"
    ip_number: "{{ ip_octets[0] * 16777216 + ip_octets[1] * 65536 + ip_octets[2] * 256 + ip_octets[3] }}"
    placement: >-
      {{ subnet_ranges
         | selectattr('start', 'le', ip_number | int)
         | selectattr('end', 'ge', ip_number | int)
         | sort(attribute='prefix', reverse=true)
         | first
         | default({'dc': 'unknown', 'subnet_group': 'unknown'}, true) }}

- name: Report discovery summary
  ansible.builtin.debug:
    msg: >-
      Discovered {{ discovered_hosts_list | length }} host(s) across
      {{ subnets }}. hosts.yaml written for the record; documentation
      subtasks in this same run will target the "discovered_fleet" group.
      {% if exclude_ips | default([]) | length > 0 %}Excluded ips this run:
      {{ exclude_ips | join(', ') }}.{% endif %}
