---
# Discovers reachable hosts on the given subnets, SSHes into each to learn
# its real hostname, groups them by stripping trailing numeric index tokens
# off the hostname (naming-agnostic -- no hardcoded role vocabulary), and:
#
#   1. Writes hosts.yaml as a plain record/artifact (git history, Grafana,
#      human reference). This file is NOT read back as inventory by this
#      or any later run -- it is output only, always fully overwritten.
#   2. Injects every discovered host into the CURRENT run's live in-memory
#      inventory via add_host, into a group called "discovered_fleet"
#      (plus its own naming-agnostic role group). The next play in
#      main.yaml targets "discovered_fleet" directly, so the SAME run's
#      subtasks operate on exactly what was just discovered -- no second
#      invocation needed.
#
# Pure raw commands only (bash/awk/sed/grep/nmap/ssh/jq) -- no python
# script involved, matching Auto-Doc's Zero-Footprint mandate. jq is
# already a control-node prerequisite (see ip-inventory.yaml).
#
# subnets accepts bare network bases ("192.168.212.0") -- /24 is assumed
# when no prefix is given -- or full CIDRs ("192.168.212.0/24"), comma
# separated.
#
# NOTE: both shell tasks below use the keyed `cmd:` form rather than the
# bare `shell: |` string form. Ansible's free-form shell/command parser
# tries to detect trailing key=value args by walking the string and
# toggling quote state on every quote character it sees, without being
# aware of bash quote nesting (a single quote inside a double-quoted
# string is literal in bash, but this parser does not know that). Scripts
# with nested quoting -- like the netplan grep below -- can trip a false
# "unbalanced jinja2 block or quotes" error even though the bash itself
# is valid. The dict/cmd: form skips that parser entirely.

- name: Check that jq is available on the control node
  ansible.builtin.command: jq --version
  register: jq_check
  changed_when: false
  failed_when: false

- name: Fail if jq is missing on the control node
  ansible.builtin.fail:
    msg: "jq is required on the control node to build hosts.yaml (sudo apt-get install -y jq)"
  when: jq_check.rc != 0

- name: Ensure outputs directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/outputs"
    state: directory
    mode: '0755'

- name: "Discover hosts and their hostnames across the given subnets"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      PORT="{{ discovery_ssh_port | default(22) }}"
      SSH_USER="{{ discovery_ssh_user | default('root') }}"
      SSH_KEY="{{ discovery_ssh_key | default('~/.ssh/id_rsa') }}"
      SSH_OPTS=(
        -o BatchMode=yes
        -o ConnectTimeout=3
        -o StrictHostKeyChecking=accept-new
        -o UserKnownHostsFile=/dev/null
        -o LogLevel=ERROR
        -p "$PORT"
        -i "$SSH_KEY"
      )
      CONCURRENCY=50
      ALL_RESULTS=()

      IFS=',' read -ra SUBNETS <<< "{{ subnets }}"

      for subnet in "${SUBNETS[@]}"; do
        subnet="$(echo "$subnet" | xargs)"
        [ -z "$subnet" ] && continue
        # Bare base like "192.168.212.0" -> assume /24
        [[ "$subnet" != */* ]] && subnet="${subnet}/24"

        if command -v nmap >/dev/null 2>&1; then
          # -T4 + explicit --host-timeout/--max-retries are required here:
          # without them, nmap adaptive timing can spend a long time per
          # address on a /24 where most IPs are unused/filtered (no RST
          # comes back). timeout is a hard backstop in case even that
          # is not enough on a weird network.
          mapfile -t OPEN_IPS < <(timeout 60 nmap -n -Pn -T4 --host-timeout 5s --max-retries 1 -p "$PORT" --open "$subnet" -oG - | awk '/Ports/{print $2}')
        else
          BASE="${subnet%.*/*}"
          mapfile -t OPEN_IPS < <(
            for i in $(seq 1 254); do
              ip="${BASE}.${i}"
              (timeout 0.5 bash -c "exec 3<>/dev/tcp/${ip}/${PORT}" 2>/dev/null && echo "$ip") &
              while (( $(jobs -r | wc -l) >= CONCURRENCY )); do wait -n; done
            done
            wait
          )
        fi

        # SSH-probe discovered hosts IN PARALLEL. Doing this one host at a
        # time (each with its own multi-second connect timeout) is the
        # other big source of apparent "hangs" once a subnet has more than
        # a handful of live hosts.
        mapfile -t RESULT_LINES < <(
          for ip in "${OPEN_IPS[@]}"; do
            (
              hostname=$(ssh "${SSH_OPTS[@]}" "${SSH_USER}@${ip}" "hostname" 2>/dev/null) || exit 0
              [ -z "$hostname" ] && exit 0

              # Naming-agnostic grouping: strip trailing -<digits> tokens,
              # repeatedly, to handle double numeric suffixes too.
              group="$hostname"
              while echo "$group" | grep -qE -- '-[0-9]+$'; do
                group=$(echo "$group" | sed -E 's/-[0-9]+$//')
              done

              printf '%s|%s|%s\n' "$ip" "$hostname" "$group"
            ) &
            while (( $(jobs -r | wc -l) >= CONCURRENCY )); do wait -n; done
          done
          wait
        )
        ALL_RESULTS+=("${RESULT_LINES[@]}")
      done

      # --- Resolve one static ip per hostname -----------------------------
      # A single machine can answer on more than one scanned ip (a real
      # static ip plus a floating/secondary one added later). We pick ONE
      # to use as ansible_host, in this order:
      #   1. netplan: an ip explicitly listed under an interface
      #      "addresses:" block on the machine itself -- this is the
      #      strongest signal, since floating ips added with `ip addr add`
      #      generally never get written into netplan config.
      #   2. route: the source ip of the default route on that machine, as
      #      a netplan-agnostic fallback that works on most distros.
      #   3. guess: lowest ip numerically, flagged as an unverified
      #      fallback rather than a confirmed identity.
      # Any ip not chosen is kept as an "extra_ips" note, not discarded.

      resolve_primary_ip() {
        local hostname="$1"; shift
        local candidates=("$@")

        if [ "$#" -eq 1 ]; then
          echo "${candidates[0]}|single"
          return
        fi

        local probe_ip="${candidates[0]}"

        local netplan_ips
        netplan_ips=$(ssh "${SSH_OPTS[@]}" "${SSH_USER}@${probe_ip}" \
          "grep -hoE '^[[:space:]]*-[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+' /etc/netplan/*.yaml 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'" 2>/dev/null)

        local match="" count=0
        for ip in "${candidates[@]}"; do
          if echo "$netplan_ips" | grep -qx "$ip"; then
            match="$ip"; count=$((count+1))
          fi
        done
        if [ "$count" -eq 1 ]; then
          echo "${match}|netplan"
          return
        fi

        local route_ip
        route_ip=$(ssh "${SSH_OPTS[@]}" "${SSH_USER}@${probe_ip}" \
          "ip -4 route get 1.1.1.1 2>/dev/null | sed -n 's/.* src \([0-9.]*\).*/\1/p'" 2>/dev/null)
        for ip in "${candidates[@]}"; do
          if [ "$ip" = "$route_ip" ]; then
            echo "${ip}|route"
            return
          fi
        done

        local lowest
        lowest=$(printf '%s\n' "${candidates[@]}" | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | head -n1)
        echo "${lowest}|guess"
      }

      declare -A HOST_IPS
      declare -A HOST_GROUP
      declare -a HOST_ORDER

      while IFS='|' read -r ip hostname group; do
        [ -z "$hostname" ] && continue
        if [ -z "${HOST_GROUP[$hostname]+x}" ]; then
          HOST_ORDER+=("$hostname")
          HOST_GROUP[$hostname]="$group"
        fi
        HOST_IPS[$hostname]="${HOST_IPS[$hostname]:-} $ip"
      done < <(printf '%s\n' "${ALL_RESULTS[@]}" | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n)

      FINAL_RESULTS=()
      for hostname in "${HOST_ORDER[@]}"; do
        read -ra candidates <<< "${HOST_IPS[$hostname]}"
        resolved=$(resolve_primary_ip "$hostname" "${candidates[@]}")
        chosen_ip="${resolved%%|*}"
        method="${resolved##*|}"

        extra=()
        for c in "${candidates[@]}"; do
          [ "$c" != "$chosen_ip" ] && extra+=("$c")
        done
        extra_csv=$(IFS=,; echo "${extra[*]}")
        [ -z "$extra_csv" ] && extra_csv="-"

        FINAL_RESULTS+=("${chosen_ip}|${hostname}|${HOST_GROUP[$hostname]}|${extra_csv}|${method}")
      done

      printf '%s\n' "${FINAL_RESULTS[@]}" | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n
  register: discovery_raw
  changed_when: false

- name: Fail loudly if nothing was discovered
  ansible.builtin.fail:
    msg: "No hosts responded on any of: {{ subnets }}. Nothing to document this run."
  when: discovery_raw.stdout | trim == ""

- name: Warn about hosts whose static ip could not be confirmed
  ansible.builtin.debug:
    msg: >-
      Unverified: {{ item.split('|')[1] }} -- picked {{ item.split('|')[0] }}
      as a best guess (no netplan match, default route also unavailable).
      Other ips seen: {{ item.split('|')[3] }}. Verify manually if this matters.
  loop: "{{ discovery_raw.stdout_lines }}"
  when:
    - item | trim != ""
    - (item.split('|') | length) == 5
    - item.split('|')[4] == "guess"
  loop_control:
    label: "{{ item.split('|')[1] }}"

- name: Write raw discovery output to a temp file
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/outputs/.discovery_raw.txt"
    content: "{{ discovery_raw.stdout }}\n"
    mode: '0644'

- name: "Write hosts.yaml as a plain output record (not read back as inventory)"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      jq -R -s '
        split("\n") | map(select(length > 0)) | map(split("|"))
        | map({
            ip: .[0], hostname: .[1], group: .[2],
            extra_ips: (if .[3] == "-" then [] else (.[3] | split(",")) end),
            ip_source: .[4]
          })
        | group_by(.group)
        | map({
            key: (.[0].group | gsub("-";"_")),
            value: {
              hosts: (map({
                key: .hostname,
                value: {
                  ansible_host: .ip,
                  target_name: .hostname,
                  target_group: .group,
                  extra_ips: .extra_ips,
                  ip_source: .ip_source
                }
              }) | from_entries)
            }
          })
        | from_entries
        | {all: {children: ., vars: {
              ansible_user: "{{ discovery_ssh_user | default('root') }}",
              ansible_ssh_private_key_file: "{{ discovery_ssh_key | default('~/.ssh/id_rsa') }}",
              ansible_port: {{ discovery_ssh_port | default(22) }}
            }}}
      ' "{{ playbook_dir }}/outputs/.discovery_raw.txt" > "{{ playbook_dir }}/hosts.yaml"
  changed_when: true

- name: Initialize discovered hosts list
  set_fact:
    discovered_hosts_list: []

- name: Parse discovery output into facts
  set_fact:
    discovered_hosts_list: >-
      {{ discovered_hosts_list + [{
        'ip': item.split('|')[0],
        'hostname': item.split('|')[1],
        'group': item.split('|')[2],
        'extra_ips': (item.split('|')[3] if item.split('|')[3] != '-' else ''),
        'ip_source': item.split('|')[4]
      }] }}
  loop: "{{ discovery_raw.stdout_lines }}"
  when:
    - item | trim != ""
    - (item.split('|') | length) == 5

- name: "Inject discovered hosts into THIS run's live inventory"
  ansible.builtin.add_host:
    name: "{{ item.hostname }}"
    groups:
      - discovered_fleet
      - "{{ item.group | replace('-', '_') }}"
    ansible_host: "{{ item.ip }}"
    target_name: "{{ item.hostname }}"
    target_group: "{{ item.group }}"
    extra_ips: "{{ item.extra_ips }}"
    ip_source: "{{ item.ip_source }}"
    ansible_user: "{{ discovery_ssh_user | default('root') }}"
    ansible_ssh_private_key_file: "{{ discovery_ssh_key | default('~/.ssh/id_rsa') }}"
    ansible_port: "{{ discovery_ssh_port | default(22) }}"
  loop: "{{ discovered_hosts_list }}"
  loop_control:
    label: "{{ item.hostname }} ({{ item.ip }})"

- name: Report discovery summary
  ansible.builtin.debug:
    msg: >-
      Discovered {{ discovered_hosts_list | length }} host(s) across
      {{ subnets }}. hosts.yaml written for the record; documentation
      subtasks in this same run will target the "discovered_fleet" group.
