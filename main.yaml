---
- name: Discover fleet
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files:
    - subnets.yaml
  vars:
    # Every /24 covered by subnets.yaml (entries with `scan: false` skipped),
    # comma-separated. Override with -e subnets=... for a one-off scan.
    subnets: >-
      {%- set out = [] -%}
      {%- for s in autodoc_subnets if s.scan | default(true) -%}
        {%- set net, pfx = s.cidr.split('/') -%}
        {%- set o = net.split('.') | map('int') | list -%}
        {%- for i in range(2 ** (24 - [pfx | int, 24] | min)) -%}
          {%- set c = o[0] ~ '.' ~ o[1] ~ '.' ~ (o[2] + i) ~ '.0' -%}
          {%- if c not in out -%}{%- set _ = out.append(c) -%}{%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ out | join(',') }}
    exclude_ips: []
  tasks:
    - name: "Expose subnets to later plays via hostvars['localhost']"
      set_fact:
        fleet_subnets: "{{ subnets }}"

    - name: Build inventory from subnets
      include_tasks: "./tasks/discover.yaml"

- name: Gather documentation data
  hosts: discovered_fleet
  become: yes
  gather_facts: no
  ignore_unreachable: true
  vars:
    ansible_ssh_common_args: >-
      -o ConnectTimeout=120
      -o ConnectionAttempts=1
      {{ '-o ProxyCommand=none' if discovery_ssh_bypass_proxy | default(false) | bool else '' }}
  tasks:
    - block:
        - name: Create Component-Based View
          include_tasks: "./tasks/{{ component }}.yaml"
          loop:
            - os
            - cpu
            - memory
            - storage
            - network
            - tools
            - docker
            - ip-inventory
          loop_control:
            loop_var: component
      ignore_errors: true

- name: Publish documentation as a spreadsheet
  hosts: localhost
  connection: local
  gather_facts: no
  tags: [sheets]
  vars:
    autodoc_python: "{{ ansible_playbook_python }}"
    autodoc_xlsx: "{{ playbook_dir }}/outputs/auto-doc.xlsx"
    sheets_secrets_file: "{{ playbook_dir }}/secrets/sheets.yaml"
  tasks:
    - name: Build xlsx and update the Google Sheet
      include_tasks: "./tasks/sheets.yaml"
