---
- name: Discover fleet
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    subnets: "192.168.104.0,192.168.200.0"
    exclude_ips: []
  tasks:
    - name: "Expose subnets to later plays via hostvars['localhost']"
      set_fact:
        fleet_subnets: "{{ subnets }}"

    - name: Build inventory from subnets
      include_tasks: "./tasks/discover.yaml"

- name: Gather documentation data
  hosts: discovered_fleet
  become: yes
  gather_facts: no
  ignore_unreachable: true
  vars:
    ansible_ssh_common_args: >-
      -o ConnectTimeout=120
      -o ConnectionAttempts=1
  tasks:
    - block:
        - name: Create Component-Based View
          include_tasks: "./tasks/{{ item }}.yaml"
          loop:
            - os
            - cpu
            - memory
            - storage
            - network
            - tools
            - docker
            - ip-inventory
      ignore_errors: true
